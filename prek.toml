# Configuration for prek (pre-commit hooks).
# See https://prek.j178.dev for documentation.
#
# Hooks are gated by file patterns — they only fire when matching files are
# staged. This means the config is safe to commit before any Rust or Kotlin
# code exists; hooks simply won't run until there are relevant files.
#
# Install into the repo:  prek install
# Run manually:           prek run --all-files

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files", args = ["--maxkb=500"] },
]

[[repos]]
repo = "local"
hooks = [
    # --- Rust (LSP server + extension) ---
    { id = "cargo-fmt",
      name = "cargo fmt --check",
      language = "system",
      entry = "cargo fmt --check",
      files = "\\.rs$",
      pass_filenames = false },

    { id = "cargo-clippy",
      name = "cargo clippy",
      language = "system",
      entry = "cargo clippy -- -D warnings",
      files = "\\.rs$",
      pass_filenames = false },

    { id = "cargo-test",
      name = "cargo test",
      language = "system",
      entry = "cargo test",
      files = "\\.rs$",
      pass_filenames = false },

    # --- Documentation sync ---
    { id = "sync-claude-agents",
      name = "CLAUDE.md == AGENTS.md",
      language = "system",
      entry = "bash -c 'diff CLAUDE.md AGENTS.md || (echo \"CLAUDE.md and AGENTS.md must be identical. Run: cp CLAUDE.md AGENTS.md\" && exit 1)'",
      files = "(CLAUDE|AGENTS)\\.md$",
      pass_filenames = false },

    # --- JVM sidecar (Kotlin + Gradle) ---
    { id = "sidecar-test",
      name = "sidecar ./gradlew test",
      language = "system",
      entry = "bash -c 'cd sidecar && ./gradlew test'",
      files = "sidecar/.*\\.(kt|kts|gradle\\.kts)$",
      pass_filenames = false },

    # --- Sensors crate (tools/sensors) ---
    # The sensors crate is a separate Cargo package outside the workspace
    # the root cargo-test hook covers, so it needs its own gates.
    { id = "sensors-fmt",
      name = "sensors cargo fmt --check",
      language = "system",
      entry = "bash -c 'cd tools/sensors && cargo fmt --check'",
      files = "tools/sensors/.*\\.rs$",
      pass_filenames = false },

    { id = "sensors-clippy",
      name = "sensors cargo clippy",
      language = "system",
      entry = "bash -c 'cd tools/sensors && cargo clippy --all-targets -- -D warnings'",
      files = "tools/sensors/.*\\.rs$",
      pass_filenames = false },

    { id = "sensors-test",
      name = "sensors cargo test",
      language = "system",
      entry = "bash -c 'cd tools/sensors && cargo test'",
      files = "tools/sensors/.*\\.rs$",
      pass_filenames = false },
]
